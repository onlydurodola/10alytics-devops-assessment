name: CD

on:
  # push:
  #   branches: [main]
    # paths:
    #   - 'app/**'
    #   - 'frontend/**'
    #   - 'deploy/**'

    workflow_dispatch:
      
env:
  BACKEND_IMAGE: ghcr.io/onlydurodola/taskapp-backend
  FRONTEND_IMAGE: ghcr.io/onlydurodola/taskapp-frontend
  APP_DIR: /opt/10alytics-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_deploy_key.pem
          chmod 600 ~/.ssh/ec2_deploy_key.pem

      - name: Create deployment .env file
        run: |
          cat > deploy/.env <<EOF
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          DB_NAME=appdb
          DB_USER=appuser
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      - name: Copy deployment files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_deploy_key.pem \
            deploy/docker-compose.yml deploy/.env \
            ubuntu@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/

      - name: Deploy application on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_deploy_key.pem \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ${{ env.APP_DIR }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            sleep 10
            docker compose ps
          EOF

      - name: Verify deployment
        run: |
          sleep 15
          curl -f http://${{ secrets.EC2_HOST }}/api/health || exit 1
